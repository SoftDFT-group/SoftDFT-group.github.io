procedure: iDFT
geometry:
  coordinate_system: Cartesian
  dimensions: [15.0]
  bin_width: [0.2]
  external_field:
    hard_walls:
      dims: [1]
species:
  - sequence: "AAAAAAAA"
    density: 0.0
    fixed:
      density: 0.05
      segment: [1]
      position: ["left"]
  - sequence: "c"
    density: 0.01
    adjustable: true
  - sequence: "a"
    density: 0.01
    adjustable: true
  - sequence: "Y"
    pSpecies: 7.0
  - sequence: "Z"
reactions:
  - species: ["A", "Y", "B"]
    coeffs: [-1, 1, 1]
    pK: 4.756
  - species: ["Y", "Z"]
    coeffs: [1, 1]
    pK: 14.0
monomers:
  A:
    diameter: 1.0
    valence: 0.0
  B:
    diameter: 1.0
    valence: -1.0
  c:
    diameter: 1.0
    valence: 1.0
  a:
    diameter: 1.0
    valence: -1.0
  Y:
    diameter: 1.0
    valence: 1.0
  Z:
    diameter: 1.0
    valence: -1.0
system:
  temperature: 298.15
  dielectric_constant: 78.4
numerical:
  max_iters: 1500
  damping: 0.05
  mixing_max: 0.05
  tole: 1e-6
model:
  - ideal
  - TPT1mfmt
  - TPT1msa

