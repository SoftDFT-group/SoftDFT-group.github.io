procedure: iDFT
geometry:
  coordinate_system: Cartesian
  dimensions: [12.0]
  bin_width: [0.05]
  external_field:
    hard_walls:
      dims: [1]
species:
  - sequence: "AAAAA"
    density: 0.0
    fixed:
      density: 0.02
      segment: [1]
      position: ["left"]
  - sequence: "S"
    density: 0.01
monomers:
  A:
    diameter: 1.0
    valence: 0.0
  S:
    diameter: 1.0
    valence: 0.0
system:
  temperature: 298.15
  dielectric_constant: 78.4
numerical:
  max_iters: 600
  damping: 0.05
  mixing_max: 0.05
  tole: 1e-7
model:
  - ideal
  - TPT1mfmt
