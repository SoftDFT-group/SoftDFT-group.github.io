procedure: iDFT
geometry:
  coordinate_system: Cartesian
  dimensions: [12.0]
  bin_width: [0.2]
  external_field:
    hard_walls:
      dims: [1]
    charged_walls:
      dims: [1]
      charge: [-0.01, 0.0]
    charge_regulated_walls:
      dims: [1]
      site_density: [0.0, 0.02]
      kind: [acid, base]
      pKa: [7.0, 7.0]
      pH: 7.0
species:
  - sequence: "c"
    density: 0.02
  - sequence: "a"
    density: 0.02
monomers:
  c:
    diameter: 1.0
    valence: 1.0
  a:
    diameter: 1.0
    valence: -1.0
system:
  temperature: 298.15
  dielectric_constant: 78.4
numerical:
  max_iters: 400
  damping: 0.1
  mixing_max: 0.1
  tole: 1e-6
model:
  - ideal
  - mfmt
  - msa
