procedure: iDFT
geometry:
  coordinate_system: Cartesian
  dimensions: [4.0, 4.0, 4.0]
  bin_width: [0.5, 0.5, 0.5]
  external_field:
    input_external:
      dims: [1, 2, 3]
      file: potential.csv
species:
  - sequence: "A"
    density: 0.1
monomers:
  A:
    diameter: 1.0
    valence: 0.0
system:
  temperature: 298.15
  dielectric_constant: 78.4
numerical:
  max_iters: 100
  damping: 0.5
  mixing_max: 0.5
  tole: 1e-11
model:
  - ideal
